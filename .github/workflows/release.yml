name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test "Abjad Calculator.sln" -c Release

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish "Abjad Calculator/NumerologicalSystemCalculator.csproj"
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "AbjadCalculator-${{ github.ref_name }}-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: AbjadCalculator-*.zip
          generate_release_notes: true
