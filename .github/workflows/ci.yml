name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "Abjad Calculator.sln"

      - name: Build
        run: dotnet build "Abjad Calculator.sln" -c Release --no-restore

      - name: Test
        run: dotnet test "Abjad Calculator.sln" -c Release --no-build --verbosity normal
